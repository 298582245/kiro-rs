# 构建镜像并推送到 GitHub Container Registry (ghcr.io)
#
# 作用：把本仓库源码在 GitHub 免费 Runner 上编译成镜像，推送到 ghcr.io，
# 服务器只需 `docker compose pull` 拉取成品（约 50MB 的 alpine 运行镜像），
# 全程不在服务器上编译 Rust —— 适配 2C2G 小内存服务器。
#
# 触发：推送到 master，或手动运行。
name: docker-build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 推送镜像到 ghcr.io 需要
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/298582245/kiro-rs:latest
          # GitHub Actions 缓存加速重复构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
